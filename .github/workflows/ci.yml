name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Diagrams up to date
        run: python3 tools/gen_diagram.py --check

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint scripts/deploy.sh
        run: shellcheck scripts/deploy.sh
