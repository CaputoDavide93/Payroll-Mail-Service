services:
  mail-service:
    build: .
    container_name: payroll-mail-service
    restart: unless-stopped
    # The worker finishes its in-flight batch on SIGTERM (up to 30 s).
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - mail-data:/data
    environment:
      # All of these are OPTIONAL — you can configure SMTP in the web UI instead.
      # If set, they seed the settings on first boot.
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
      - FROM_NAME=${FROM_NAME:-}
      - DAILY_LIMIT=${DAILY_LIMIT:-1800}
      # Set a password to protect the UI when hosting on a public server.
      - APP_PASSWORD=${APP_PASSWORD:-}
      # Blank = built-in default (smtp.gmail.com,smtp-relay.gmail.com).
      - SMTP_HOST_ALLOWLIST=${SMTP_HOST_ALLOWLIST:-}
      # Optional: AI payslip matching (can also be pasted in Settings).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PAYSLIP_DELETE_AFTER_SEND=${PAYSLIP_DELETE_AFTER_SEND:-true}
      - PAYSLIP_RETENTION_DAYS=${PAYSLIP_RETENTION_DAYS:-7}
      # Set to 1 behind one reverse proxy (nginx, Caddy). Blank = off.
      - TRUST_PROXY=${TRUST_PROXY:-}
      - PORT=${PORT:-3000}
      # DATA_DIR stays /data (set in the Dockerfile) so state lands on the mail-data volume.

volumes:
  mail-data:
