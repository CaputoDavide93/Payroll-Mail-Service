<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 608" width="1180" height="608" role="img" aria-label="An office browser reaches nginx on one EC2 instance over HTTPS; nginx proxies to the app container. Secrets Manager supplies the .env at boot. scripts/deploy.sh pushes the image to ECR and tells the instance over SSM to run payroll-update, which pulls the tag, health-checks it and rolls back on failure. payroll-cert keeps the Let's Encrypt certificate current using a Route53 DNS-01 challenge."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker></defs><rect x="330" y="40" width="520" height="332" rx="14" fill="#11151b" stroke="#30363d" stroke-width="1" stroke-dasharray="6 5"/><text x="348.0" y="64.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa4b0" text-anchor="start" font-weight="600">EC2 INSTANCE, AMAZON LINUX 2023</text><rect x="354" y="84" width="210" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(370.0,97.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z M9 12l2 2 4-4"/></g><text x="401.0" y="112.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">nginx</text><text x="370.0" y="136.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">TLS on 443,</text><text x="370.0" y="154.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">80 redirects to 443</text><rect x="616" y="84" width="210" height="84" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(632.0,97.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z M3 7l9 4 9-4 M12 11v10"/></g><text x="663.0" y="112.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">App container</text><text x="632.0" y="136.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">SQLite and payslips on</text><text x="632.0" y="154.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">the mail-data volume</text><rect x="354" y="240" width="210" height="100" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(370.0,253.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v10H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></g><text x="401.0" y="268.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">payroll-cert</text><text x="370.0" y="292.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">issues and renews the</text><text x="370.0" y="310.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">certificate, twice daily</text><rect x="616" y="240" width="210" height="100" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(632.0,253.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6 4 12l7 6z M20 6l-7 6 7 6z"/></g><text x="663.0" y="268.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">payroll-update</text><text x="632.0" y="292.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">pulls a tag, health-checks,</text><text x="632.0" y="310.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">rolls back on failure</text><polyline points="572,126 608,126" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="590.0" y="117.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">:3000</text><polyline points="459.0,232 459.0,176" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="471.0" y="208.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">certificate</text><polyline points="721.0,232 721.0,176" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="733.0" y="208.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">restarts</text><rect x="24" y="84" width="226" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,97.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="71.0" y="112.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Office browser</text><text x="40.0" y="136.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">office CIDRs only,</text><text x="40.0" y="154.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">no SSH at all</text><polyline points="258,126 346,126" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="302.0" y="117.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">:443</text><rect x="24" y="240" width="226" height="100" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,253.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z M9 12l2 2 4-4"/></g><text x="71.0" y="268.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Let's Encrypt</text><text x="40.0" y="292.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">issues the certificate</text><text x="40.0" y="310.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">for domain_name</text><polyline points="346,290 258,290" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="302.0" y="281.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">DNS-01</text><rect x="940" y="84" width="216" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(956.0,97.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M12 12h9 M18 12v3 M15 12v2"/></g><text x="987.0" y="112.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Secrets Manager</text><text x="956.0" y="136.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">app config, written</text><text x="956.0" y="154.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">to .env at boot</text><polyline points="932,126 834,126" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="940" y="240" width="216" height="100" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(956.0,253.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z M3 7l9 4 9-4 M12 11v10"/></g><text x="987.0" y="268.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">ECR</text><text x="956.0" y="292.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">scan on push; keeps</text><text x="956.0" y="310.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">:latest and :base</text><polyline points="932,290 834,290" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="883.0" y="281.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">pull</text><rect x="24" y="432" width="226" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,445.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M3 12h18 M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></g><text x="71.0" y="460.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Route53</text><text x="40.0" y="484.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">A record to the Elastic IP,</text><text x="40.0" y="502.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">TXT for the challenge</text><polyline points="459.0,348 459.0,474 258,474" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="447.0" y="465.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="end">TXT record</text><rect x="940" y="432" width="216" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(956.0,445.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3z M7 10l3 2.5L7 15 M12 15h5"/></g><text x="987.0" y="460.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">scripts/deploy.sh</text><text x="956.0" y="484.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">builds and pushes,</text><text x="956.0" y="502.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">then rolls the instance</text><polyline points="1048,424 1048,348" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="1036.0" y="406.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="end">push :sha, :latest, :base</text><polyline points="932,474 721.0,474 721.0,348" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="733.0" y="465.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">SSM: payroll-update &lt;sha&gt;</text><line x1="24" y1="556" x2="1156" y2="556" stroke="#232a33" stroke-width="1"/><text x="24.0" y="582.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Only the office reaches the instance, on 443 and 80. Releases arrive over SSM, not SSH, and one that fails its health check rolls itself back.</text></svg>