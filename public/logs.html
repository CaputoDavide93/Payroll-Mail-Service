<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logs — Payroll Mail Service</title>
  <link rel="stylesheet" href="styles.css?v=20260624c" />
  <style>
    .logs-toolbar {
      display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
      margin-bottom: .75rem; font-size: .85rem;
    }
    .logs-toolbar .spacer { flex: 1; }
    .seg { display: inline-flex; border: 1px solid var(--border, #d0d7de); border-radius: 7px; overflow: hidden; }
    .seg button {
      border: 0; background: #fff; padding: .3rem .7rem; cursor: pointer; font-size: .8rem;
      color: #57606a; border-right: 1px solid var(--border, #d0d7de);
    }
    .seg button:last-child { border-right: 0; }
    .seg button.active { background: #1f6feb; color: #fff; }
    .logs-pill { font-size: .75rem; color: #57606a; display: inline-flex; align-items: center; gap: .35rem; }
    .dot { width: .55rem; height: .55rem; border-radius: 50%; background: #3fb950; box-shadow: 0 0 0 3px rgba(63,185,80,.18); }
    .dot.paused { background: #d29922; box-shadow: 0 0 0 3px rgba(210,153,34,.18); }

    .logwin {
      background: #0d1117; color: #c9d1d9; border-radius: 10px; border: 1px solid #30363d;
      height: 62vh; overflow-y: auto; padding: .5rem .25rem;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: .82rem; line-height: 1.5;
    }
    .logrow { display: grid; grid-template-columns: 86px 70px 110px 1fr; gap: .6rem; padding: .12rem .8rem; border-left: 3px solid transparent; }
    .logrow:hover { background: rgba(255,255,255,.03); }
    .logrow .t { color: #6e7681; white-space: nowrap; }
    .logrow .lvl { font-weight: 700; text-transform: uppercase; font-size: .72rem; letter-spacing: .04em; }
    .logrow .cat { color: #8b949e; }
    .logrow .msg { color: #c9d1d9; white-space: pre-wrap; word-break: break-word; }
    .lv-info    .lvl { color: #58a6ff; } .lv-info    { border-left-color: #1f6feb33; }
    .lv-success .lvl { color: #3fb950; } .lv-success { border-left-color: #3fb95044; }
    .lv-warn    .lvl { color: #d29922; } .lv-warn    { border-left-color: #d2992244; background: rgba(210,153,34,.06); }
    .lv-error   .lvl { color: #f85149; } .lv-error   { border-left-color: #f8514966; background: rgba(248,81,73,.08); }
    .logs-empty { color: #6e7681; padding: 1.5rem; text-align: center; }
    @media (max-width: 640px) { .logrow { grid-template-columns: 70px 60px 1fr; } .logrow .cat { display: none; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">✉️</span>
      <div>
        <h1>Payroll Mail Service</h1>
        <p class="tagline">Live activity log — uploads, matching, protection, sends.</p>
      </div>
    </div>
    <div class="row">
      <a href="/" class="btn ghost">📨 Campaigns</a>
      <a href="/payslips.html" class="btn ghost">📋 Payslips</a>
      <a href="/logs.html" class="btn ghost">📜 Logs</a>
      <a href="/howto.html" class="btn ghost">❓ How-to</a>
      <a href="/settings.html" class="btn ghost">⚙️ Settings</a>
    </div>
  </header>

  <main class="container" style="max-width:980px">
    <h1 style="font-size:1.4rem;margin-bottom:1rem">📜 Activity Logs</h1>

    <div class="logs-toolbar">
      <div class="seg" id="levelSeg">
        <button data-level="all" class="active">All</button>
        <button data-level="info">Info</button>
        <button data-level="success">Success</button>
        <button data-level="warn">Warnings</button>
        <button data-level="error">Errors</button>
      </div>
      <span class="logs-pill"><span class="dot" id="liveDot"></span><span id="liveText">Live</span></span>
      <div class="spacer"></div>
      <span class="logs-pill" id="countPill">0 entries</span>
      <button id="pauseBtn" class="btn small">⏸ Pause</button>
      <button id="clearBtn" class="btn small">🧹 Clear view</button>
      <label class="logs-pill" style="cursor:pointer"><input type="checkbox" id="autoscroll" checked /> Auto-scroll</label>
    </div>

    <div class="logwin" id="logwin"><div class="logs-empty" id="emptyMsg">Waiting for activity…</div></div>
    <p class="muted" style="font-size:.78rem;margin-top:.5rem">Most recent activity (in-memory, last 1000 events). Also available via <code>docker logs</code>.</p>
  </main>

  <dialog id="loginDialog" class="card dialog" style="width:min(360px,96vw)">
    <h2 style="margin-top:0">🔒 Enter password</h2>
    <form id="loginForm">
      <input id="loginPassword" class="input" type="password" placeholder="App password" autocomplete="current-password" />
      <p id="loginError" class="status err"></p>
      <div style="display:flex;justify-content:flex-end;margin-top:1rem">
        <button type="submit" class="btn primary">Unlock</button>
      </div>
    </form>
  </dialog>

  <script src="logs.js?v=20260624c"></script>
</body>
</html>
